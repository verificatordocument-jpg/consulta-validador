<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Certificado</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #5c6873;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        .wrapper {
            position: relative;
            width: 100%;
            max-width: 1280px;
        }
        .wrapper img {
            width: 100%;
            display: block;
        }
        .input-cert {
            position: absolute;
            top: 16.5%;
            left: 9.3%;
            width: 61.5%;
            height: 4.2%;
            border: 1px solid #ccc;
            background: #fafafa;
            padding: 8px 12px;
            font-size: 15px;
            outline: none;
        }
        .select-pais {
            position: absolute;
            top: 29.8%;
            left: 9.3%;
            width: 61.5%;
            height: 4.2%;
            border: 1px solid #ccc;
            background: #fafafa;
            padding: 8px 12px;
            font-size: 15px;
            outline: none;
        }
        .btn-consultor {
            position: absolute;
            top: 36.8%;
            left: 63.8%;
            width: 7%;
            height: 3.8%;
            background-color: #9B1B30;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }
        .btn-consultor:hover {
            background-color: #7A1425;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <img src="imagen.png" alt="Formulario de Verificación">

        <input type="text" id="certificado" class="input-cert" placeholder="">
        
        <select id="pais" class="select-pais">
            <option value="">--Seleccione--</option>
            <option value="Chile">Chile</option>
            <option value="Argentina">Argentina</option>
            <option value="Peru">Perú</option>
            <option value="Colombia">Colombia</option>
            <option value="Mexico">México</option>
            <option value="Espana">España</option>
            <option value="Otro">Otro</option>
        </select>

        <button id="btnConsultor" class="btn-consultor">Consultor</button>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const certParam = urlParams.get('certificado');
        const paisParam = urlParams.get('pais');

        if (certParam) {
            document.getElementById('certificado').value = certParam;
        }
        if (paisParam) {
            document.getElementById('pais').value = paisParam;
        }

        document.getElementById('btnConsultor').addEventListener('click', function() {
            const certificadoVal = document.getElementById('certificado').value;
            const paisVal = document.getElementById('pais').value;

            if (!certificadoVal || !paisVal) {
                alert('Por favor, complete el número de certificado y seleccione el país.');
                return;
            }

            const pdfContent = `%PDF-1.4
1 0 obj
<< /Type /Catalog /Pages 2 0 R >>
endobj
2 0 obj
<< /Type /Pages /Kids [3 0 R] /Count 1 >>
endobj
3 0 obj
<< /Type /Page /Parent 2 0 R /Resources << /Font << /F1 << /Type /Font /Subtype /Type1 /BaseFont /Helvetica >> >> >> /MediaBox [0 0 612 792] /Contents 4 0 R >>
endobj
4 0 obj
<< /Length 75 >>
stream
BT
/F1 18 Tf
50 700 Td
(Certificado Oficial Verificado) Tj
/F1 12 Tf
0 -30 Td
(Numero: ${certificadoVal}) Tj
0 -20 Td
(Pais: ${paisVal}) Tj
ET
endstream
endobj
xref
0 5
0000000000 65535 f 
0000000009 00000 n 
0000000058 00000 n 
0000000115 00000 n 
0000000267 00000 n 
trailer
<< /Size 5 /Root 1 0 R >>
startxref
397
%%EOF`;

            const blob = new Blob([pdfContent], { type: 'application/pdf' });
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.download = `Certificado_${certificadoVal}.pdf`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>

</body>
</html>
