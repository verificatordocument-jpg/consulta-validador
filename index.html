<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Certificado</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f0f0f0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        header {
            background-color: #8B1E3F;
            height: 40px;
            width: 100%;
        }
        .main-container {
            flex: 1;
            max-width: 900px;
            width: 100%;
            margin: 40px auto;
            background-color: #f0f0f0;
            padding: 20px;
        }
        h2 {
            font-size: 22px;
            color: #000;
            margin-bottom: 25px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            color: #A30000;
            font-size: 14px;
            margin-bottom: 8px;
        }
        input[type="text"], select {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdcdc;
            background-color: #fafafa;
            font-size: 14px;
            color: #333;
            border-radius: 2px;
        }
        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #8B1E3F;
            background-color: #fff;
        }
        .btn-container {
            display: flex;
            justify-content: flex-end;
            margin-top: 30px;
        }
        button {
            background-color: #9B1B30;
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #7A1425;
        }
        footer {
            background-color: #5c6873;
            height: 60px;
            width: 100%;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header></header>

    <div class="main-container">
        <h2>Verificación</h2>
        
        <div class="form-group">
            <label for="certificado">N° de Certificado:*</label>
            <input type="text" id="certificado" placeholder="">
        </div>

        <div class="form-group">
            <label for="pais">País:*</label>
            <select id="pais">
                <option value="">--Seleccione--</option>
                <option value="Chile">Chile</option>
                <option value="Argentina">Argentina</option>
                <option value="Peru">Perú</option>
                <option value="Colombia">Colombia</option>
                <option value="Mexico">México</option>
                <option value="Espana">España</option>
                <option value="Otro">Otro</option>
            </select>
        </div>

        <div class="btn-container">
            <button id="btnConsultor">Consultor</button>
        </div>
    </div>

    <footer></footer>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const certParam = urlParams.get('certificado');
        const paisParam = urlParams.get('pais');

        if (certParam) {
            document.getElementById('certificado').value = certParam;
        }
        if (paisParam) {
            document.getElementById('pais').value = paisParam;
        }

        document.getElementById('btnConsultor').addEventListener('click', function() {
            const certificadoVal = document.getElementById('certificado').value;
            const paisVal = document.getElementById('pais').value;

            if (!certificadoVal || !paisVal) {
                alert('Por favor, complete el número de certificado y seleccione el país.');
                return;
            }

            const pdfContent = `%PDF-1.4
1 0 obj
<< /Type /Catalog /Pages 2 0 R >>
endobj
2 0 obj
<< /Type /Pages /Kids [3 0 R] /Count 1 >>
endobj
3 0 obj
<< /Type /Page /Parent 2 0 R /Resources << /Font << /F1 << /Type /Font /Subtype /Type1 /BaseFont /Helvetica >> >> >> /MediaBox [0 0 612 792] /Contents 4 0 R >>
endobj
4 0 obj
<< /Length 75 >>
stream
BT
/F1 18 Tf
50 700 Td
(Certificado Oficial Verificado) Tj
/F1 12 Tf
0 -30 Td
(Numero: ${certificadoVal}) Tj
0 -20 Td
(Pais: ${paisVal}) Tj
ET
endstream
endobj
xref
0 5
0000000000 65535 f 
0000000009 00000 n 
0000000058 00000 n 
0000000115 00000 n 
0000000267 00000 n 
trailer
<< /Size 5 /Root 1 0 R >>
startxref
397
%%EOF`;

            const blob = new Blob([pdfContent], { type: 'application/pdf' });
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.download = `Certificado_${certificadoVal}.pdf`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        });
    </script>
</body>
</html>
