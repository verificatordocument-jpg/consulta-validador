<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificación de Certificado</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }
        body {
            background-color: #EBEBEB;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        /* Barra superior color guinda idéntica a tu imagen */
        header {
            background-color: #8C223A;
            height: 55px;
            width: 100%;
        }
        /* Contenedor central idéntico */
        .main-container {
            flex: 1;
            max-width: 950px;
            width: 100%;
            margin: 0 auto;
            background-color: #EBEBEB;
            padding: 40px 40px;
        }
        h2 {
            font-size: 24px;
            color: #000000;
            font-weight: bold;
            margin-bottom: 30px;
        }
        .form-group {
            margin-bottom: 25px;
        }
        label {
            display: block;
            color: #A6192E;
            font-size: 15px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        input[type="text"], select {
            width: 100%;
            padding: 14px 12px;
            border: 1px solid #CCCCCC;
            background-color: #FAFAFA;
            font-size: 15px;
            color: #333333;
            border-radius: 2px;
        }
        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #8C223A;
            background-color: #FFFFFF;
        }
        .btn-container {
            display: flex;
            justify-content: flex-end;
            margin-top: 35px;
        }
        button {
            background-color: #932238;
            color: white;
            border: none;
            padding: 10px 22px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #751B2C;
        }
        /* Franja gris inferior */
        footer {
            background-color: #5C6873;
            height: 70px;
            width: 100%;
            margin-top: auto;
        }
    </style>
</head>
<body>

    <header></header>

    <div class="main-container">
        <h2>Verificación</h2>
        
        <div class="form-group">
            <label for="certificado">N° de Certificado:*</label>
            <input type="text" id="certificado" placeholder="">
        </div>

        <div class="form-group">
            <label for="pais">País:*</label>
            <select id="pais">
                <option value="">--Seleccione--</option>
                <option value="Chile">Chile</option>
                <option value="Argentina">Argentina</option>
                <option value="Peru">Perú</option>
                <option value="Colombia">Colombia</option>
                <option value="Mexico">México</option>
                <option value="Espana">España</option>
                <option value="Otro">Otro</option>
            </select>
        </div>

        <div class="btn-container">
            <button id="btnConsultor">Consultor</button>
        </div>
    </div>

    <footer></footer>

    <script>
        // Prellenar automáticamente el certificado y el país desde el enlace
        const urlParams = new URLSearchParams(window.location.search);
        const certParam = urlParams.get('certificado');
        const paisParam = urlParams.get('pais');

        if (certParam) {
            document.getElementById('certificado').value = certParam;
        }
        if (paisParam) {
            document.getElementById('pais').value = paisParam;
        }

        // Al hacer clic en "Consultor", busca y descarga el PDF asociado al número de certificado
        document.getElementById('btnConsultor').addEventListener('click', function() {
            const certificadoVal = document.getElementById('certificado').value.trim();
            const paisVal = document.getElementById('pais').value;

            if (!certificadoVal || !paisVal) {
                alert('Por favor, complete el número de certificado y seleccione el país.');
                return;
            }

            // Abre o descarga el PDF que subiste a GitHub con ese número (Ej: 12345.pdf)
            window.open(`${certificadoVal}.pdf`, '_blank');
        });
    </script>
</body>
</html>
