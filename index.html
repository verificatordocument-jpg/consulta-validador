<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VALIDADOR - Verificación</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }
        body {
            background-color: #5c6873;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }
        /* Contenedor que adapta perfectamente tu imagen definitiva */
        .wrapper {
            position: relative;
            width: 100%;
            max-width: 1280px;
        }
        .wrapper img {
            width: 100%;
            display: block;
        }
        /* Casilla interactiva para el N° de Certificado (calzada sobre la imagen) */
        .input-cert {
            position: absolute;
            top: 17.0%;
            left: 11.5%;
            width: 76%;
            height: 5.2%;
            border: none;
            background: transparent;
            padding: 8px 12px;
            font-size: 16px;
            color: #333;
            outline: none;
        }
        /* Casilla interactiva para el selector de País (calzada sobre la imagen) */
        .select-pais {
            position: absolute;
            top: 29.3%;
            left: 11.5%;
            width: 76%;
            height: 5.2%;
            border: none;
            background: transparent;
            padding: 8px 12px;
            font-size: 16px;
            color: #333;
            outline: none;
        }
        /* Botón invisible o transparente colocado exactamente sobre el botón rojo "Consultor" de tu imagen */
        .btn-consultor {
            position: absolute;
            top: 38.2%;
            left: 78.5%;
            width: 9.2%;
            height: 4.5%;
            background-color: transparent;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="wrapper">
        <!-- Tu imagen definitiva con todos los textos, títulos y estilos -->
        <img src="fondo.png" alt="VALIDADOR">

        <!-- Entradas interactivas ubicadas exactamente sobre los espacios en blanco -->
        <input type="text" id="certificado" class="input-cert">
        
        <select id="pais" class="select-pais">
            <option value="">--Seleccione--</option>
            <option value="Chile">Chile</option>
            <option value="Argentina">Argentina</option>
            <option value="Peru">Perú</option>
            <option value="Colombia">Colombia</option>
            <option value="Mexico">México</option>
            <option value="Espana">España</option>
            <option value="Otro">Otro</option>
        </select>

        <button id="btnConsultor" class="btn-consultor"></button>
    </div>

    <script>
        // Prellenar automáticamente los datos si vienen por parámetros en la URL
        const urlParams = new URLSearchParams(window.location.search);
        const certParam = urlParams.get('certificado');
        const paisParam = urlParams.get('pais');

        if (certParam) {
            document.getElementById('certificado').value = certParam;
        }
        if (paisParam) {
            document.getElementById('pais').value = paisParam;
        }

        // Al hacer clic en el botón "Consultor", abre o descarga el PDF asociado al número ingresado
        document.getElementById('btnConsultor').addEventListener('click', function() {
            const certificadoVal = document.getElementById('certificado').value.trim();
            const paisVal = document.getElementById('pais').value;

            if (!certificadoVal || !paisVal) {
                alert('Por favor, complete el número de certificado y seleccione el país.');
                return;
            }

            // Abre el archivo PDF guardado con ese número exacto en tu repositorio (Ej: 123456.pdf)
            window.open(`${certificadoVal}.pdf`, '_blank');
        });
    </script>
</body>
</html>
